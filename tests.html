<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grant Inventory — tests</title>
<!-- The app's own stylesheets, on purpose: a QR can be encoded perfectly and
     still render as a solid block because of a stray global rule. Testing the
     encoder without the CSS misses exactly that class of bug. -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
<style>
  body { font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
         margin: 0; padding: 24px; background: #14150f; color: #eee; }
  h1 { font-size: 20px; }
  h2 { font-size: 15px; margin: 24px 0 8px; color: #c9ae87; text-transform: uppercase; letter-spacing: .06em; }
  .case { padding: 6px 10px; border-left: 3px solid #333; margin: 4px 0; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .pass { border-color: #2fd6a4; }
  .fail { border-color: #ff6b6b; background: #2a1616; }
  .detail { color: #999; }
  #summary { margin-top: 20px; padding: 12px 16px; border-radius: 10px; font-weight: 700; }
  .ok { background: #12352c; color: #2fd6a4; }
  .bad { background: #38201c; color: #ff6b6b; }
  #samples { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; }
  #samples figure { margin: 0; text-align: center; }
  #samples svg { width: 150px; height: 150px; background: #fff; border-radius: 6px; }
  figcaption { font-size: 11px; color: #999; margin-top: 4px; max-width: 150px; word-break: break-all; }
</style>
</head>
<body>
<h1>Grant Inventory — tests</h1>
<div id="out"></div>
<div id="summary"></div>
<h2>Rendered samples — scan these with a phone</h2>
<div id="samples"></div>

<script type="module">
import { encode, toSvg, rsEncode, formatBits, versionBits, blockStructure } from './js/vendor/qr.js';
import { slug } from './js/core/model.js';
import * as ean from './js/vendor/ean.js';
import { addInterval, daysBetween } from './js/core/model.js';
import { warrantyEnd, warrantyState } from './js/data/purchases.js';
import { shrink, storagePath } from './js/features/photos.js';
import { resolve } from './js/core/theme.js';
import { groupByShape } from './js/core/sync.js';
import { parseBulkLines } from './js/ui/bulk-add.js';
import {
  usageStats, memberActivity, spendTotal, spendByMonth, spendByVendor,
  monthsBack, yearStart,
} from './js/features/analytics.js';

const out = document.getElementById('out');
let passed = 0, failed = 0;

function group(name) {
  out.insertAdjacentHTML('beforeend', `<h2>${name}</h2>`);
}
function check(name, actual, expected) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  const ok = a === e;
  ok ? passed++ : failed++;
  out.insertAdjacentHTML('beforeend',
    `<div class="case ${ok ? 'pass' : 'fail'}">${ok ? 'PASS' : 'FAIL'} — ${name}` +
    (ok ? '' : `<div class="detail">got ${a}<br>want ${e}</div>`) + `</div>`);
}
function ok(name, condition, detail = '') {
  condition ? passed++ : failed++;
  out.insertAdjacentHTML('beforeend',
    `<div class="case ${condition ? 'pass' : 'fail'}">${condition ? 'PASS' : 'FAIL'} — ${name}` +
    (condition ? '' : `<div class="detail">${detail}</div>`) + `</div>`);
}
const hex = arr => [...arr].map(b => b.toString(16).padStart(2, '0')).join(' ');

/* ---------------------------------------------------------------- Reed-Solomon
   The worked example from the specification: version 1, level M, "01234567".
   If the generator polynomial or the GF(256) arithmetic is wrong, this fails. */

group('Reed–Solomon');
{
  const data = [0x10, 0x20, 0x0c, 0x56, 0x61, 0x80, 0xec, 0x11,
                0xec, 0x11, 0xec, 0x11, 0xec, 0x11, 0xec, 0x11];
  const want = 'a5 24 d4 c1 ed 36 c7 87 2c 55';
  check('spec example, 10 EC codewords', hex(rsEncode(data, 10)), want);
}

/* --------------------------------------------------------- Format / version info
   Published BCH tables. These are what a scanner reads first. */

group('Format and version information');
{
  const M = [0x5412, 0x5125, 0x5e7c, 0x5b4b, 0x45f9, 0x40ce, 0x4f97, 0x4aa0];
  const L = [0x77c4, 0x72f3, 0x7daa, 0x789d, 0x662f, 0x6318, 0x6c41, 0x6976];
  const Q = [0x355f, 0x3068, 0x3f31, 0x3a06, 0x24b4, 0x2183, 0x2eda, 0x2bed];
  const H = [0x1689, 0x13be, 0x1ce7, 0x19d0, 0x0762, 0x0255, 0x0d0c, 0x083b];
  for (const [level, table] of [['L', L], ['M', M], ['Q', Q], ['H', H]]) {
    check(`format bits, level ${level}`,
      table.map((_, mask) => formatBits(level, mask)), table);
  }
  check('version bits 7-10',
    [7, 8, 9, 10].map(versionBits), [0x07c94, 0x085bc, 0x09a99, 0x0a4d3]);
}

/* ------------------------------------------------------------------- Structure */

group('Matrix structure');
{
  const q = encode('STRUCTURE', { ecc: 'M' });
  const at = (r, c) => q.modules[r][c];

  ok('size follows version', q.size === q.version * 4 + 17, `size ${q.size}, version ${q.version}`);

  const finderOk = ([r0, c0]) => {
    for (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++) {
      const ring = (r === 0 || r === 6 || c === 0 || c === 6);
      const core = r >= 2 && r <= 4 && c >= 2 && c <= 4;
      if (at(r0 + r, c0 + c) !== (ring || core ? 1 : 0)) return false;
    }
    return true;
  };
  ok('finder top-left', finderOk([0, 0]));
  ok('finder top-right', finderOk([0, q.size - 7]));
  ok('finder bottom-left', finderOk([q.size - 7, 0]));

  let timing = true;
  for (let i = 8; i < q.size - 8; i++) {
    if (at(6, i) !== (i % 2 === 0 ? 1 : 0)) timing = false;
    if (at(i, 6) !== (i % 2 === 0 ? 1 : 0)) timing = false;
  }
  ok('timing patterns alternate', timing);
  ok('dark module set', at(q.size - 8, 8) === 1);

  let unset = 0;
  for (let r = 0; r < q.size; r++) for (let c = 0; c < q.size; c++) if (at(r, c) < 0) unset++;
  ok('every module written', unset === 0, `${unset} left unset`);
}

/* --------------------------------------------------------------- Round trip
   Read the matrix back the way a scanner does: recover the format info, undo
   the mask, walk the same zigzag, de-interleave, and rebuild the string.
   This is what proves the data placement order, not just that it looks right. */

group('Decode round trip');

const MASKS = [
  (r, c) => (r + c) % 2 === 0,
  (r) => r % 2 === 0,
  (r, c) => c % 3 === 0,
  (r, c) => (r + c) % 3 === 0,
  (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
  (r, c) => ((r * c) % 2) + ((r * c) % 3) === 0,
  (r, c) => ((((r * c) % 2) + ((r * c) % 3)) % 2) === 0,
  (r, c) => ((((r + c) % 2) + ((r * c) % 3)) % 2) === 0,
];
const LEVEL_FROM_BITS = { 0b01: 'L', 0b00: 'M', 0b11: 'Q', 0b10: 'H' };

function decode(q) {
  // 1. Format information from the copy beside the top-left finder.
  let raw = 0;
  const read = (r, c) => q.modules[r][c];
  const bits = [];
  for (let i = 0; i <= 5; i++) bits[i] = read(8, i);
  bits[6] = read(8, 7); bits[7] = read(8, 8); bits[8] = read(7, 8);
  for (let i = 9; i <= 14; i++) bits[i] = read(14 - i, 8);
  for (let i = 0; i < 15; i++) raw |= bits[i] << i;

  const unmasked = raw ^ 0x5412;
  const level = LEVEL_FROM_BITS[(unmasked >> 13) & 0b11];
  const mask = (unmasked >> 10) & 0b111;

  // 2. Undo the mask over data modules only.
  const fn = MASKS[mask];
  const grid = q.modules.map((row, r) =>
    Array.from(row, (v, c) => (!q.reserved[r][c] && fn(r, c)) ? v ^ 1 : v));

  // 3. Same zigzag, reading instead of writing.
  const bitsOut = [];
  let upward = true;
  for (let right = q.size - 1; right > 0; right -= 2) {
    if (right === 6) right--;
    for (let step = 0; step < q.size; step++) {
      const row = upward ? q.size - 1 - step : step;
      for (const col of [right, right - 1]) {
        if (q.reserved[row][col]) continue;
        bitsOut.push(grid[row][col]);
      }
    }
    upward = !upward;
  }
  const codewords = [];
  for (let i = 0; i + 8 <= bitsOut.length; i += 8) {
    codewords.push(bitsOut.slice(i, i + 8).reduce((acc, b) => (acc << 1) | b, 0));
  }

  // 4. De-interleave back into blocks and keep the data half.
  const { g1n, g1c, g2n, g2c } = blockStructure(q.version, level);
  const sizes = [...Array(g1n).fill(g1c), ...Array(g2n).fill(g2c)];
  const blocks = sizes.map(() => []);
  let idx = 0;
  const maxLen = Math.max(...sizes);
  for (let i = 0; i < maxLen; i++) {
    for (let b = 0; b < sizes.length; b++) {
      if (i < sizes[b]) blocks[b].push(codewords[idx++]);
    }
  }
  const data = blocks.flat();

  // 5. Strip the byte-mode header and rebuild the text.
  const countBits = q.version < 10 ? 8 : 16;
  let pos = 0;
  const takeBits = n => {
    let v = 0;
    for (let i = 0; i < n; i++) {
      const byte = data[(pos >> 3)] ?? 0;
      v = (v << 1) | ((byte >> (7 - (pos & 7))) & 1);
      pos++;
    }
    return v;
  };
  const mode = takeBits(4);
  const length = takeBits(countBits);
  const bytes = [];
  for (let i = 0; i < length; i++) bytes.push(takeBits(8));

  return { mode, level, mask, text: new TextDecoder().decode(Uint8Array.from(bytes)) };
}

{
  const cases = [
    'A',
    'Pantry Shelf 2',
    'https://cgrant10.github.io/grant_inventory/#/l/pantry-shelf-2-5ewy',
    'https://cgrant10.github.io/grant_inventory/#/l/' + slug('Garage overflow tote number four'),
    // 100 bytes fits every level at version 10. Level H tops out at 119, which
    // is the documented ceiling of this encoder, not a defect.
    'x'.repeat(100),
    'café — naïve ★ 日本',            // multi-byte UTF-8
  ];
  for (const text of cases) {
    for (const level of ['L', 'M', 'Q', 'H']) {
      let result;
      try { result = decode(encode(text, { ecc: level })); }
      catch (err) { ok(`${level}: ${text.slice(0, 28)}`, false, err.message); continue; }
      const label = `${level} v? "${text.slice(0, 28)}${text.length > 28 ? '…' : ''}"`;
      ok(`${label} — text`, result.text === text, `got "${result.text}"`);
      ok(`${label} — level read back`, result.level === level, `got ${result.level}`);
      ok(`${label} — byte mode`, result.mode === 4, `got mode ${result.mode}`);
    }
  }
}

/* ------------------------------------------------------------------ Versions */

group('Version selection');
{
  const v = n => encode('x'.repeat(n), { ecc: 'M' }).version;
  ok('short payload uses version 1', v(10) === 1, `got ${v(10)}`);
  ok('growing payload grows the version', v(10) <= v(40) && v(40) <= v(120),
     `${v(10)}, ${v(40)}, ${v(120)}`);
  let threw = false;
  try { encode('x'.repeat(400), { ecc: 'H' }); } catch { threw = true; }
  ok('oversized payload is rejected, not silently truncated', threw);

  // Location URLs are ~70 bytes; this is the headroom that matters in practice.
  const url = 'https://cgrant10.github.io/grant_inventory/#/l/' + slug('Garage Overflow Tote 4');
  ok(`location URL fits at level H (${url.length} bytes)`,
     (() => { try { return encode(url, { ecc: 'H' }).version <= 10; } catch { return false; } })());
}

/* ------------------------------------------------------------------ Slugs */

group('Slugs');
{
  ok('slug is url-safe', /^[a-z0-9-]+$/.test(slug('Pantry Shelf #2!')), slug('Pantry Shelf #2!'));
  ok('slug keeps a readable stem', slug('Garage Bin').startsWith('garage-bin'));
  const many = new Set(Array.from({ length: 5000 }, () => slug('Pantry Shelf 2')));
  ok('5000 slugs from one name are unique', many.size === 5000, `${many.size} unique`);
  ok('empty name still yields a slug', slug('').length > 4, slug(''));
  ok('no confusable characters in the suffix',
     Array.from({ length: 200 }, () => slug('x').split('-').pop()).every(s => !/[lo01]/.test(s)));
}

/* ---------------------------------------------------------------- Rendering
   Encoding correctly is not enough — a QR can be perfect and still paint as a
   blob because of a stray stylesheet rule.

   The computed-style checks are the real guard here. A global `svg { stroke:
   currentColor; stroke-width: 1.9 }` gave every 1-unit module a 1.9-unit
   outline and merged the whole code into a block; asserting the path ends up
   unstroked catches exactly that.

   The pixel count below is a weaker check by nature: rasterising a serialised
   SVG through an <img> deliberately drops page CSS, so it validates the
   encoder-to-SVG path but is blind to stylesheet damage. Both are kept — they
   fail for different reasons. */

group('Rendering');
{
  const { qrElement } = await import('./js/ui/qr.js');

  const host = document.createElement('div');
  host.style.cssText = 'position:absolute;left:-9999px;top:0';
  document.body.append(host);

  const wrap = qrElement('https://cgrant10.github.io/grant_inventory/#/l/fridge-rtceek',
                         { size: 200, ecc: 'Q' });
  host.append(wrap);

  const svgEl = wrap.querySelector('svg');
  const pathEl = svgEl.querySelector('path');
  const cs = getComputedStyle(pathEl);

  // This is the assertion that would have caught the blob.
  ok('QR path is unstroked under the app stylesheets',
     cs.stroke === 'none' || cs.strokeWidth === '0px',
     `stroke ${cs.stroke}, width ${cs.strokeWidth}`);
  ok('QR path fill is not "none"', cs.fill !== 'none', `fill ${cs.fill}`);

  const svgText = new XMLSerializer().serializeToString(svgEl);
  const url = URL.createObjectURL(new Blob([svgText], { type: 'image/svg+xml' }));
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });

  const side = 240;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = side;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, side, side);
  URL.revokeObjectURL(url);
  host.remove();

  const { data } = ctx.getImageData(0, 0, side, side);
  let dark = 0;
  for (let i = 0; i < data.length; i += 4) {
    if ((data[i] + data[i + 1] + data[i + 2]) / 3 < 128) dark++;
  }
  const ratio = dark / (side * side);

  // A real QR lands near 50% once the quiet zone is included; a solid block is
  // ~1.0 and a blank one ~0.
  ok(`rendered QR is ${(ratio * 100).toFixed(1)}% dark, not a solid block`,
     ratio > 0.2 && ratio < 0.65, `ratio ${ratio.toFixed(3)}`);

  // Corners of the quiet zone must be light, which a blob would fail.
  const px = (x, y) => { const i = (y * side + x) * 4; return (data[i] + data[i+1] + data[i+2]) / 3; };
  ok('quiet zone is light', px(2, 2) > 200 && px(side - 3, 2) > 200 && px(2, side - 3) > 200,
     `${px(2,2)}, ${px(side-3,2)}, ${px(2,side-3)}`);
}

/* ------------------------------------------------------------------- Barcodes
   Check digits verified by hand against the EAN/UPC rule, so these are real
   vectors and not the implementation checking itself. */

group('Barcodes — check digits');
{
  check('EAN-13 4006381333931', ean.checkDigit('400638133393'), 1);
  check('UPC-A 036000291452',   ean.checkDigit('03600029145'), 2);
  check('EAN-8  96385074',      ean.checkDigit('9638507'), 4);

  ok('valid EAN-13 accepted', ean.isValidBarcode('4006381333931'));
  ok('valid UPC-A accepted',  ean.isValidBarcode('036000291452'));
  ok('valid EAN-8 accepted',  ean.isValidBarcode('96385074'));
  ok('wrong check digit rejected', !ean.isValidBarcode('4006381333932'));
  ok('short code rejected', !ean.isValidBarcode('12345'));
  ok('non-numeric rejected', !ean.isValidBarcode('40063813339a1'));
}

group('Barcodes — bit round trip');
{
  const codes = ['4006381333931', '5901234123457', '0012345678905', '9780306406157'];
  for (const code of codes) {
    const bits = ean.encodeEan13(code);
    ok(`${code} encodes to 95 modules`, bits.length === 95, `got ${bits.length}`);
    check(`${code} decodes back`, ean.decodeEan13Bits(bits), code);
  }
  const eight = ean.encodeEan8('96385074');
  ok('EAN-8 encodes to 67 modules', eight.length === 67, `got ${eight.length}`);
  check('EAN-8 decodes back', ean.decodeEan8Bits(eight), '96385074');

  // A corrupted module must not produce a plausible-looking number.
  const broken = ean.encodeEan13('4006381333931').split('');
  broken[20] = broken[20] === '1' ? '0' : '1';
  ok('corrupted bits decode to null, not a wrong number',
     ean.decodeEan13Bits(broken.join('')) === null);
}

/* Turn a module string into pixels the way a camera would see it: a quiet zone,
   several pixels per module, and optional blur and noise. */
function barsToRow(bits, { scale = 3, quiet = 20, noise = 0, blur = 0, dark = 30, light = 225 } = {}) {
  const width = quiet * 2 + bits.length * scale;
  const row = new Uint8ClampedArray(width).fill(light);
  for (let m = 0; m < bits.length; m++) {
    if (bits[m] !== '1') continue;
    for (let p = 0; p < scale; p++) row[quiet + m * scale + p] = dark;
  }
  if (blur) {
    const copy = Uint8ClampedArray.from(row);
    for (let i = blur; i < width - blur; i++) {
      let sum = 0;
      for (let k = -blur; k <= blur; k++) sum += copy[i + k];
      row[i] = sum / (blur * 2 + 1);
    }
  }
  if (noise) {
    for (let i = 0; i < width; i++) {
      row[i] = Math.max(0, Math.min(255, row[i] + (Math.sin(i * 12.9898) * 43758.5453 % 1) * noise));
    }
  }
  return row;
}

group('Barcodes — decoding a scanline');
{
  const code = '4006381333931';
  const bits = ean.encodeEan13(code);

  check('clean scanline', ean.decodeRow(barsToRow(bits)), code);
  check('narrow modules (2px)', ean.decodeRow(barsToRow(bits, { scale: 2 })), code);
  check('wide modules (6px)', ean.decodeRow(barsToRow(bits, { scale: 6 })), code);
  check('low contrast', ean.decodeRow(barsToRow(bits, { dark: 90, light: 165 })), code);
  check('blurred', ean.decodeRow(barsToRow(bits, { scale: 4, blur: 1 })), code);
  check('upside down', ean.decodeRow(Uint8ClampedArray.from(barsToRow(bits)).reverse()), code);
  check('EAN-8 scanline', ean.decodeRow(barsToRow(ean.encodeEan8('96385074'))), '96385074');

  const blank = new Uint8ClampedArray(400).fill(200);
  ok('blank frame decodes to null', ean.decodeRow(blank) === null);
  ok('flat dark frame decodes to null',
     ean.decodeRow(new Uint8ClampedArray(400).fill(20)) === null);
}

group('Barcodes — decoding a frame');
{
  const code = '5901234123457';
  const bits = ean.encodeEan13(code);
  const row = barsToRow(bits, { scale: 4 });
  const width = row.length, height = 80;
  const data = new Uint8ClampedArray(width * height * 4);

  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      // Bars only occupy the middle band; the rest is background, as on a label.
      const v = (y > 15 && y < 65) ? row[x] : 235;
      const p = (y * width + x) * 4;
      data[p] = data[p + 1] = data[p + 2] = v;
      data[p + 3] = 255;
    }
  }
  check('decodes from an ImageData frame',
        ean.decodeImage({ width, height, data }), code);

  const empty = new Uint8ClampedArray(width * height * 4).fill(240);
  for (let i = 3; i < empty.length; i += 4) empty[i] = 255;
  ok('empty frame decodes to null',
     ean.decodeImage({ width, height, data: empty }) === null);
}

/* ------------------------------------------------------- Maintenance schedules
   Recurring dates are where this kind of feature quietly rots: month-end,
   leap years, and daylight saving all bite. */

group('Maintenance — interval maths');
{
  check('6 months keeps the day of month', addInterval('2026-01-15', 6, 'month'), '2026-07-15');
  check('12 months is the same date next year', addInterval('2026-03-02', 12, 'month'), '2027-03-02');
  check('1 year', addInterval('2026-08-04', 1, 'year'), '2027-08-04');
  check('7 days', addInterval('2026-08-04', 7, 'day'), '2026-08-11');
  check('2 weeks', addInterval('2026-08-04', 2, 'week'), '2026-08-18');

  // Month-end must clamp, not spill into the next month.
  check('31 Jan + 1 month clamps to February', addInterval('2026-01-31', 1, 'month'), '2026-02-28');
  check('31 Jan + 1 month in a leap year', addInterval('2028-01-31', 1, 'month'), '2028-02-29');
  check('31 Mar + 1 month clamps to April', addInterval('2026-03-31', 1, 'month'), '2026-04-30');
  check('30 Nov + 3 months', addInterval('2026-11-30', 3, 'month'), '2027-02-28');

  // Crossing a year boundary.
  check('6 months from October', addInterval('2026-10-15', 6, 'month'), '2027-04-15');
  check('Leap day + 1 year clamps', addInterval('2028-02-29', 1, 'year'), '2029-02-28');

  // A six-month cycle repeated must not drift.
  let d = '2026-01-15';
  const cycle = [];
  for (let i = 0; i < 4; i++) { d = addInterval(d, 6, 'month'); cycle.push(d); }
  check('four six-month cycles do not drift',
        cycle, ['2026-07-15', '2027-01-15', '2027-07-15', '2028-01-15']);

  check('daysBetween forwards', daysBetween('2026-08-04', '2026-08-11'), 7);
  check('daysBetween backwards (overdue)', daysBetween('2026-08-11', '2026-08-04'), -7);
  check('daysBetween across a leap day', daysBetween('2028-02-28', '2028-03-01'), 2);
  check('daysBetween across DST', daysBetween('2026-03-01', '2026-04-01'), 31);
}

/* ------------------------------------------------------------- Warranty dates
   Same calendar arithmetic as maintenance, but the consequence of getting it
   wrong is worse: a warranty shown as live when it lapsed last week. */

group('Warranties');
{
  check('1 year from a purchase', warrantyEnd('2026-08-04', 12), '2027-08-04');
  check('90 days quoted as 3 months', warrantyEnd('2026-08-04', 3), '2026-11-04');
  check('leap-day purchase clamps', warrantyEnd('2028-02-29', 12), '2029-02-28');
  check('no date means no warranty', warrantyEnd(null, 12), null);
  check('zero months means no warranty', warrantyEnd('2026-08-04', 0), null);

  const mk = until => ({ warranty_until: until });
  const iso = days => new Date(Date.now() + days * 86400000).toISOString().slice(0, 10);

  check('nothing recorded reads as null, not expired', warrantyState({}), null);
  check('yesterday is expired', warrantyState(mk(iso(-1))), 'expired');
  check('today still counts as covered', warrantyState(mk(iso(0))), 'soon');
  check('next week is ending soon', warrantyState(mk(iso(7))), 'soon');
  check('next year is comfortably active', warrantyState(mk(iso(365))), 'active');
  check('the soon window is a parameter', warrantyState(mk(iso(45)), 30), 'active');
  check('a deleted receipt has no warranty', warrantyState({ warranty_until: iso(365), deleted_at: 'x' }), null);
}

/* ------------------------------------------------------------------ Analytics
   Every figure takes `asOf` so the answers are fixed, not dependent on the day
   the tests happen to run. */

group('Analytics — consumption');
{
  const asOf = '2026-08-04';
  const at = (days, extra = {}) => ({
    item_id: 'a', type: 'consume', delta: -1,
    created_at: `${addInterval(asOf, -days, 'day')}T12:00:00Z`, ...extra,
  });

  const items = [{ id: 'a', name: 'Coffee', quantity: 10, unit: 'bag' }];

  // 10 used over 100 days is 0.1/day; 10 in stock is 100 days of cover.
  const events = Array.from({ length: 10 }, (_, i) => at(i * 10));
  const [coffee] = usageStats(events, items, { days: 100, asOf });
  check('usage totals the consumed events', coffee.used, 10);
  check('cover is stock divided by the daily rate', coffee.daysLeft, 100);
  check('and lands on a date', coffee.runsOutOn, '2026-11-12');

  check('events outside the window are ignored',
        usageStats([at(200)], items, { days: 100, asOf }).length, 0);
  check('an event dated in the future is ignored',
        usageStats([at(-5)], items, { days: 100, asOf }).length, 0);

  // Adjustments are recounts, not usage. Counting them turns one correction
  // into a fake spike and a fake run-out date.
  check('adjustments are not usage',
        usageStats([at(1, { type: 'adjust', delta: -8 })], items, { days: 100, asOf }).length, 0);

  check('an item nobody used does not appear',
        usageStats([], items, { days: 100, asOf }).length, 0);

  check('deleted items are left out',
        usageStats(events, [{ ...items[0], deleted_at: 'x' }], { days: 100, asOf }).length, 0);

  // Two items, the scarcer one first.
  const two = usageStats(
    [...events, { item_id: 'b', type: 'consume', delta: -20, created_at: `${asOf}T09:00:00Z` }],
    [...items, { id: 'b', name: 'Soap', quantity: 1 }],
    { days: 100, asOf });
  check('sorted by what runs out first', two.map(u => u.item.id), ['b', 'a']);

  const who = memberActivity(
    [at(1, { member_id: 'm1' }), at(2, { member_id: 'm1' }), at(3, { member_id: 'm2' }), at(90, { member_id: 'm2' })],
    [{ id: 'm1', display_name: 'Grant' }, { id: 'm2', display_name: 'Sam' }],
    { days: 30, asOf });
  check('activity counts inside the window, busiest first',
        who.map(w => [w.name, w.count]), [['Grant', 2], ['Sam', 1]]);
}

group('Analytics — spending');
{
  const asOf = '2026-08-04';
  const buys = [
    { purchased_on: '2026-08-01', price: 100, vendor: 'Menards' },
    { purchased_on: '2026-08-03', price: 50,  vendor: 'menards ' },
    { purchased_on: '2026-07-15', price: 25,  vendor: 'Amazon' },
    { purchased_on: '2025-06-01', price: 999, vendor: 'Amazon' },   // outside 12 months
    { purchased_on: '2026-08-02', price: 10,  vendor: null },
    { purchased_on: null,         price: 500, vendor: 'Unknown' },   // undated
    { purchased_on: '2026-08-02', price: 77,  deleted_at: 'x' },     // deleted
  ];

  check('this month sums only this month', spendTotal(buys, { from: '2026-08-01', to: asOf }), 160);
  check('undated purchases are not counted', spendTotal(buys, { from: '2020-01-01', to: asOf }), 1184);
  check('deleted receipts are not counted',
        spendTotal([{ purchased_on: asOf, price: 5, deleted_at: 'x' }], { from: '2020-01-01', to: asOf }), 0);

  const months = spendByMonth(buys, { months: 3, asOf });
  check('three months, oldest first', months.map(m => m.key), ['2026-06', '2026-07', '2026-08']);
  check('an empty month is kept as a zero, not dropped', months.map(m => m.total), [0, 25, 160]);
  check('months are labelled', months.map(m => m.label), ['Jun', 'Jul', 'Aug']);

  check('twelve months steps back a year', monthsBack(13, asOf)[0], '2025-08');

  const vendors = spendByVendor(buys, { from: yearStart(asOf), to: asOf });
  check('vendors ranked by spend',
        vendors.map(v => [v.vendor, v.total]),
        [['Menards', 150], ['Amazon', 25], ['Not recorded', 10]]);
  check('one shop, however it was typed',
        spendByVendor([
          { purchased_on: asOf, price: 1, vendor: ' Ace ' },
          { purchased_on: asOf, price: 2, vendor: 'ACE' },
        ]).map(v => [v.vendor, v.total]), [['Ace', 3]]);
}

/* -------------------------------------------------------------------- Photos
   The shrink step is what keeps a household inside a 1 GB bucket, so it is worth
   proving rather than assuming. These run against real canvas encoding. */

group('Photos');
{
  check('storage path is foldered by entity and named by attachment',
        storagePath('item', 'abc', 'def'), 'item/abc/def.jpg');

  const png = async (w, h) => {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    // Not a flat fill: a solid colour compresses to almost nothing and would
    // make the size assertions meaningless.
    for (let x = 0; x < w; x += 8) {
      ctx.fillStyle = `hsl(${(x * 7) % 360} 70% 50%)`;
      ctx.fillRect(x, 0, 8, h);
    }
    return new Promise(r => c.toBlob(r, 'image/png'));
  };

  const big = await png(3000, 2000);
  const shrunk = await shrink(big);
  check('the long edge is capped', [shrunk.width, shrunk.height], [1600, 1067]);
  check('re-encoded as JPEG', shrunk.blob.type, 'image/jpeg');
  // Not "smaller than the source blob": a synthetic test image is flat colour
  // that PNG stores better than JPEG ever will, so that would test the codecs,
  // not the feature. What shrink promises is pixels, and a bounded result.
  ok('a fraction of the pixels', (shrunk.width * shrunk.height) / (3000 * 2000) < 0.3,
     `${shrunk.width}x${shrunk.height} from 3000x2000`);
  ok('comfortably inside a few hundred KB', shrunk.blob.size < 500 * 1024,
     `${Math.round(shrunk.blob.size / 1024)}KB`);

  const tall = await shrink(await png(1000, 4000));
  check('portrait is capped on its own long edge', [tall.width, tall.height], [400, 1600]);

  const small = await shrink(await png(800, 600));
  check('an already-small photo keeps its size', [small.width, small.height], [800, 600]);

  const custom = await shrink(await png(2000, 1000), { maxEdge: 100 });
  check('the cap is a parameter', [custom.width, custom.height], [100, 50]);
}

/* ----------------------------------------------------------------- Appearance
   "System" has to mean the system, and an explicit choice has to beat it —
   including when the two disagree, which is the whole reason the setting exists. */

group('Appearance');
{
  check('system on a dark phone', resolve('system', true), 'dark');
  check('system on a light phone', resolve('system', false), 'light');
  check('dark beats a light phone', resolve('dark', false), 'dark');
  check('light beats a dark phone', resolve('light', true), 'light');
  // Anything unrecognised — a hand-edited key, a value from a future build —
  // must fall back to the phone rather than to a guess.
  check('an unknown preference follows the phone', resolve('sepia', true), 'dark');
  check('no preference follows the phone', resolve(null, false), 'light');
}

/* ------------------------------------------------------------- Push batching
   PostgREST rejects a whole batch — not the odd row — when the objects in it do
   not carry identical keys, so getting this wrong wedges every queued write to
   a table at once. */

group('Sync — batching by shape');
{
  const shapes = rows => groupByShape(rows).map(g => g.map(r => r.id));

  check('identical shapes travel together',
        shapes([{ id: 'a', name: 'x' }, { id: 'b', name: 'y' }]), [['a', 'b']]);

  // The real case: a locally created row next to one pulled from the server,
  // which carries household_id that Postgres filled in from a default.
  check('a local row and a server row are split',
        shapes([
          { id: 'new', name: 'x' },
          { id: 'pulled', name: 'y', household_id: 'h' },
        ]), [['new'], ['pulled']]);

  check('rows regroup rather than fragmenting',
        shapes([
          { id: 'a', name: 'x' },
          { id: 'b', name: 'y', household_id: 'h' },
          { id: 'c', name: 'z' },
          { id: 'd', name: 'w', household_id: 'h' },
        ]), [['a', 'c'], ['b', 'd']]);

  check('key order does not make a new shape',
        shapes([{ id: 'a', name: 'x', kind: 'k' }, { id: 'b', kind: 'k', name: 'y' }]),
        [['a', 'b']]);

  check('nothing in, nothing out', groupByShape([]), []);
  check('one row is one group', shapes([{ id: 'a' }]), [['a']]);

  // A null still counts as a column present, which is what PostgREST cares about.
  check('an explicit null is not a missing column',
        shapes([{ id: 'a', notes: null }, { id: 'b', notes: 'hi' }]), [['a', 'b']]);
}

/* --------------------------------------------------------------- Bulk add
   A list typed on a phone is messy: stray commas, dictation capitalising things,
   a heading in the middle. What must never happen is a line landing as an item
   that is not the item the person meant. */

group('Bulk add parsing');
{
  const rows = text => parseBulkLines(text).rows;
  const errs = text => parseBulkLines(text).errors.map(e => e.line);

  check('a bare name is one of the thing',
        rows('Duct tape'), [{ name: 'Duct tape', quantity: 1, unit: 'ea' }]);
  check('name and quantity',
        rows('Black beans, 4'), [{ name: 'Black beans', quantity: 4, unit: 'ea' }]);
  check('name, quantity and unit',
        rows('Paper towels, 6, roll'), [{ name: 'Paper towels', quantity: 6, unit: 'roll' }]);

  // The order people actually type in varies, and a unit alone is common.
  check('a unit without a quantity still means one',
        rows('Milk, gal'), [{ name: 'Milk', quantity: 1, unit: 'gal' }]);
  check('units are matched case-insensitively but stored canonically',
        rows('Water, 2, L\nSoda, 2, l').map(r => r.unit), ['L', 'L']);

  check('tabs separate too, so a pasted column works',
        rows('Screws\t50\tea'), [{ name: 'Screws', quantity: 50, unit: 'ea' }]);

  // Zero is a real answer — "we are out of this, but I want to track it".
  check('zero is allowed', rows('Coffee, 0')[0].quantity, 0);
  check('fractions survive', rows('Flour, 2.5, lb')[0].quantity, 2.5);

  check('blank lines and headings are skipped, not rejected',
        rows('# Pantry\n\nRice\n\n# Garage\nRope').map(r => r.name), ['Rice', 'Rope']);

  check('trailing commas do not invent an empty column',
        rows('Rope, 2,'), [{ name: 'Rope', quantity: 2, unit: 'ea' }]);

  // The three that must be refused rather than guessed at.
  check('an unknown unit is refused', errs('Coffee, 2, tins'), [1]);
  check('a negative quantity is refused', errs('Coffee, -2'), [1]);
  check('the bad line is the only one reported',
        errs('Rice\nCoffee, 2, tins\nRope'), [2]);

  // A rejected line must not quietly take its neighbours down with it, because
  // the sheet shows a count of what is ready alongside what is wrong.
  check('good lines still parse alongside a bad one',
        rows('Rice\nCoffee, 2, tins\nRope').map(r => r.name), ['Rice', 'Rope']);

  check('nothing in, nothing out', parseBulkLines(''), { rows: [], errors: [] });
  check('whitespace only is not an item', parseBulkLines('   \n\t\n').rows, []);
}

/* ------------------------------------------------------------------ Summary */

summary.className = failed ? 'bad' : 'ok';
summary.textContent = failed ? `${failed} failed, ${passed} passed` : `All ${passed} tests passed`;

  'https://cgrant10.github.io/grant_inventory/#/l/garage-tote-a-9k2m',
  'Grant Household Inventory',
]) {

}
