<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1a1a16" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2ede5" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grant">
<title>Grant Household Inventory</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/favicon-64.png" sizes="64x64">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">

<!-- Escape hatch: ?reset wipes the caches and the service worker, then reloads.
     This lives inline, in the document, on purpose. The service worker fetches
     navigations network-first, so this markup is always fresh — but the module
     JS is served cache-first, so a stale bundle can't be relied on to contain
     its own fix. Anything that ships in js/ is unreachable when js/ is the
     thing that's stale. -->
<script>
  (function () {
    if (!/[?&]reset\b/.test(location.search)) return;
    document.documentElement.style.visibility = 'hidden';
    var jobs = [];
    if (window.caches) jobs.push(caches.keys().then(function (keys) {
      return Promise.all(keys.map(function (k) { return caches.delete(k); }));
    }));
    if (navigator.serviceWorker) jobs.push(
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }));
    Promise.all(jobs).catch(function () {}).then(function () {
      var u = new URL(location.href);
      u.searchParams.delete('reset');
      u.searchParams.set('v', Date.now().toString(36));
      location.replace(u.toString());
    });
  })();
</script>

<!-- Chrome fires beforeinstallprompt early, often before the module graph has
     finished loading. Stash it here so js/core/install.js can't miss it. -->
<script>
  window.__installPrompt = null;
  addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__installPrompt = e;
    dispatchEvent(new Event('installable'));
  });
  addEventListener('appinstalled', function () {
    window.__installPrompt = null;
    dispatchEvent(new Event('installed'));
  });
</script>
</head>
<body>

<!-- Boot / auth gate. Replaced by the app shell once unlocked. -->
<div id="gate" class="gate" hidden>
  <div class="gate-card">
    <img class="gate-logo" src="assets/logo.png" alt="Grant Household Inventory" width="512" height="512">
    <h1 class="sr-only">Grant Household Inventory</h1>
    <p class="gate-sub">Enter the household passphrase to sync with everyone else.</p>
    <!-- No `required` attributes: a hidden required field blocks submit with no
         visible reaction at all. Validation happens in JS, where it can explain
         itself. -->
    <form id="gate-form" autocomplete="on" novalidate>
      <input id="gate-name" class="field" type="text" placeholder="Your name" autocomplete="name">
      <input id="gate-pass" class="field" type="password" placeholder="Household passphrase"
             autocomplete="current-password">
      <button id="gate-submit" class="btn btn-primary btn-lg" type="submit">Unlock</button>
    </form>
    <p id="gate-error" class="gate-error" hidden></p>
    <div id="gate-install" class="gate-install" hidden></div>
    <button id="gate-offline" class="btn btn-ghost">Use offline on this phone only</button>
    <p id="gate-version" class="version"></p>
  </div>
</div>

<div id="app" class="app" hidden>
  <header class="topbar">
    <button id="back" class="icon-btn" hidden aria-label="Back">
      <svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="title" class="topbar-title">Home</h1>
    <div class="topbar-actions">
      <!-- A coloured dot nobody can interpret is not a status. Tapping it says
           what it means in words. -->
      <button id="sync-dot" class="sync-dot" aria-label="Sync status"></button>
      <a id="search-btn" class="icon-btn" href="#/search" aria-label="Search">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </a>
      <button id="settings-btn" class="icon-btn" aria-label="Settings">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      </button>
    </div>
  </header>

  <div id="update-bar" class="update-bar" hidden role="status">
    <span id="update-text" class="update-text"></span>
    <button id="update-btn" class="btn btn-primary update-btn">Update</button>
  </div>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar">
    <a class="tab" href="#/home" data-tab="home">
      <svg class="ico" viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>Home</span>
    </a>
    <a class="tab" href="#/inventory" data-tab="inventory">
      <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M3 11h18M8 7V3h8v4"/></svg>
      <span>Items</span>
    </a>
    <a class="tab tab-scan" href="#/scan" data-tab="scan" aria-label="Scan">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3"/><path d="M7 12h10"/></svg>
    </a>
    <a class="tab" href="#/shopping" data-tab="shopping">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 5h2l2.5 11h9L20 8H7"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
      <span>Shop</span>
    </a>
    <a class="tab" href="#/home-info" data-tab="home-info">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6 20V8l6-4 6 4v12"/><path d="M10 20v-5h4v5"/></svg>
      <span>House</span>
    </a>
  </nav>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="sheet-root"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
