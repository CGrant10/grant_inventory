<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f1417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inventory">
<title>Home Inventory</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>

<!-- Boot / auth gate. Replaced by the app shell once unlocked. -->
<div id="gate" class="gate" hidden>
  <div class="gate-card">
    <img class="gate-logo" src="assets/icons/icon-192.png" alt="">
    <h1>Home Inventory</h1>
    <p class="gate-sub">Enter the household passphrase to sync with everyone else.</p>
    <form id="gate-form" autocomplete="on">
      <input id="gate-name" class="field" type="text" placeholder="Your name" autocomplete="name" required>
      <input id="gate-pass" class="field" type="password" placeholder="Household passphrase"
             autocomplete="current-password" required>
      <button class="btn btn-primary btn-lg" type="submit">Unlock</button>
    </form>
    <p id="gate-error" class="gate-error" hidden></p>
    <button id="gate-offline" class="btn btn-ghost">Use offline on this phone only</button>
  </div>
</div>

<div id="app" class="app" hidden>
  <header class="topbar">
    <button id="back" class="icon-btn" hidden aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="title" class="topbar-title">Home</h1>
    <div class="topbar-actions">
      <span id="sync-dot" class="sync-dot" title="Sync status"></span>
      <button id="settings-btn" class="icon-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar">
    <a class="tab" href="#/home" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>Home</span>
    </a>
    <a class="tab" href="#/inventory" data-tab="inventory">
      <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M3 11h18M8 7V3h8v4"/></svg>
      <span>Items</span>
    </a>
    <a class="tab tab-scan" href="#/scan" data-tab="scan" aria-label="Scan">
      <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3"/><path d="M7 12h10"/></svg>
    </a>
    <a class="tab" href="#/shopping" data-tab="shopping">
      <svg viewBox="0 0 24 24"><path d="M4 5h2l2.5 11h9L20 8H7"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
      <span>Shop</span>
    </a>
    <a class="tab" href="#/home-info" data-tab="home-info">
      <svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6 20V8l6-4 6 4v12"/><path d="M10 20v-5h4v5"/></svg>
      <span>House</span>
    </a>
  </nav>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="sheet-root"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
